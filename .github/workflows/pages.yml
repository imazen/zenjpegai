name: Pages demo

# Builds both wasm packages (simd + threads), the web bundle, fetches the demo-assets-v1
# release assets (bakes them into the published site so visitors never need private-repo
# access), runs the Playwright suite against the built site, and deploys to GitHub Pages.
#
# GitHub Pages is NOT enabled on this repo yet (checked 2026-09-17: `gh api
# repos/imazen/zenjpegai/pages` -> 404, repo is private). The `deploy` job below is correctly
# configured but will fail at the `actions/deploy-pages` step until a human does exactly this:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# See web/README.md "GitHub Pages" for what publishing makes public (demo streams, the packed
# BSD-licensed upstream weights, this wasm build) and why that's a one-time human decision this
# workflow does not make for you.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'wasm/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZENJPEGAI_NIGHTLY: nightly-2026-09-02

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.ZENJPEGAI_NIGHTLY }}
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            web/.tools
          key: pages-cargo-${{ hashFiles('Cargo.lock', 'wasm/Cargo.toml') }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: build wasm packages (simd + threads)
        run: web/scripts/build-wasm.sh simd threads

      - name: fetch demo-assets-v1 (private repo: this workflow's own token can read its own releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/fetch-demo-assets.mjs

      - name: build the servable site
        run: node web/scripts/build-site.mjs

      - name: install Playwright browsers (webkit best-effort)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium firefox
          npx playwright install --with-deps webkit || echo "webkit install failed; running chromium+firefox only" >&2

      - name: Playwright suite
        working-directory: web
        run: |
          projects="--project=chromium --project=firefox"
          npx playwright test --list --project=webkit >/dev/null 2>&1 && projects="$projects --project=webkit"
          npx playwright test $projects
        env:
          CI: '1'

      - name: upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

      - name: upload wasm_decode benchmark TSVs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wasm-decode-benchmarks
          path: benchmarks/wasm_decode_*.tsv

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
