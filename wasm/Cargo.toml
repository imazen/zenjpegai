[package]
name = "zenjpegai-wasm"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version = "1.89"
description = "WebAssembly bindings of the zenjpegai JPEG AI decoder (browser polyfill core)"
repository = "https://github.com/imazen/zenjpegai"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Rayon inside wasm through wasm-bindgen-rayon: needs SharedArrayBuffer (a cross-origin isolated
# page), a nightly toolchain with -Z build-std and +atomics,+bulk-memory,+mutable-globals.
# Built by `web/scripts/build-wasm.sh threads`; the default build is single-threaded SIMD128.
threads = ["zenjpegai/parallel", "dep:wasm-bindgen-rayon", "dep:rayon"]
# WebGPU synthesis through the `zenjpegai-gpu` crate (wgpu): adds the async `initGpu`,
# `gpuStatus` and `present` exports, and gives `decode` a GPU path that falls back to the CPU
# engine on any GpuError. Built by `web/scripts/build-wasm.sh webgpu` as `pkg-webgpu`.
gpu = [
    "dep:zenjpegai-gpu",
    "dep:wgpu",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    "dep:console_error_panic_hook",
]

[dependencies]
zenjpegai = { path = "..", default-features = false, features = ["std", "unstable-internals", "wasm-clock"] }
zenjpegai-gpu = { path = "../gpu", default-features = false, optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu"], optional = true }
web-sys = { version = "0.3.104", features = ["OffscreenCanvas"], optional = true }
wasm-bindgen-futures = { version = "0.4.77", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen = "0.2.128"
js-sys = "0.3.105"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"], optional = true }
rayon = { version = "1.12.0", optional = true }

[dev-dependencies]
pollster = "1.0.1"
