[package]
name = "zenjpegai-gpu"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version = "1.89"
description = "WebGPU (wgpu) synthesis backend for the zenjpegai JPEG AI decoder"
repository = "https://github.com/imazen/zenjpegai"
publish = false

[features]
default = ["parallel", "avx512", "pth"]
# Threaded CPU stages (entropy threads, hyper-decoder, context model) through zenjpegai/parallel.
parallel = ["zenjpegai/parallel"]
# AVX-512 kernels for the CPU stages (and the CPU side of the benchmarks).
avx512 = ["zenjpegai/avx512"]
# Read upstream `.pth` checkpoints directly, which the tests and `gpu_bench` do through
# `ModelDir`. A browser build that supplies packed weights itself does not need it.
pth = ["zenjpegai/pth"]
# Tests that need a GPU adapter, the upstream checkpoints and the reference vectors. With this
# feature on, a missing adapter or missing data is a hard failure. Run through `just gpu-test`.
gpu-tests = ["pth"]

[dependencies]
zenjpegai = { path = "..", default-features = false, features = ["std", "unstable-internals"] }
enough = { version = "0.4.4", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12", "webgpu"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
futures-channel = { version = "0.3.34", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Instant::now panics on wasm32-unknown-unknown; the browser timer lives in js-sys.
js-sys = "0.3.105"
