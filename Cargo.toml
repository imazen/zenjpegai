[package]
name = "zenjpegai"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version = "1.89"

description = "JPEG AI (ISO/IEC 6048-1 | ITU-T T.840.1) learned image codec in safe Rust — a port of the JPEG AI reference software"
homepage = "https://github.com/imazen/zenjpegai"
repository = "https://github.com/imazen/zenjpegai"
documentation = "https://docs.rs/zenjpegai"
categories = ["multimedia::images", "multimedia::encoding", "encoding"]
keywords = ["jpeg-ai", "image", "decoder", "encoder", "codec"]
readme = "README.md"
autobenches = false

include = ["/src", "LICENSE-AGPL3", "LICENSE-COMMERCIAL", "upstream-notices", "README.md", "CHANGELOG.md"]

[workspace]
members = [".", "gpu", "wasm"]

[features]
default = ["std", "parallel", "avx512", "pth"]
# File IO helpers (checkpoint loading from disk) and std::error::Error impls.
std = []
# Multi-threaded network inference and entropy-thread decoding via rayon.
parallel = ["std", "dep:rayon"]
# Tests that need the upstream reference checkout (models, reference vectors). With this
# feature on, missing data is a hard failure, never a skip. Run through `just test-ref`.
reference-tests = []
# AVX-512 kernels (archmage v4 tier).
avx512 = ["archmage/avx512", "magetypes/avx512"]
# `nn`, `model`, `tools`, `mans`, `bitio`, `container`, `tensor`, `weights` and `filters` as
# `pub` instead of `pub(crate)`: not a committed public API (module layout and signatures may
# still change), but the escape hatch this crate's own CLI/tests/benches and the `gpu`/`wasm`
# sibling crates need. See PORTING.md "API hygiene".
unstable-internals = []
# A real clock for `DecodeStats` on `wasm32-unknown-unknown`, where `Instant::now()` panics:
# `Tick` then reads `js_sys::Date::now()` (ms as f64). Only the browser packages turn this on;
# without it (or on a non-JS wasm host) the probe stays zero-cost and reports zeros, as before.
wasm-clock = ["std", "dep:js-sys"]
# The `zenjpegai` command line tool (PNG output through zenpng). Needs unstable-internals: the
# CLI reaches nn::fast::{Engine, Tier, set_pool_limit}, model::*, weights::packed::*.
cli = ["std", "pth", "dep:zenpng", "dep:imgref", "dep:rgb", "unstable-internals"]
# zencodec trait implementations (decode: DecoderConfig / DecodeJob / Decode; encode:
# EncoderConfig / EncodeJob / Encoder) for dispatch through zencodecs and other
# zencodec-driven pipelines. Decode is RGB output only, encode RGB input only (src/codec.rs).
# Needs unstable-internals: JpegAiDecoderConfig/JpegAiEncoderConfig's public API takes
# model::ModelSource + nn::fast::Engine.
zencodec = ["std", "dep:zencodec", "dep:zenpixels", "unstable-internals"]
# Reading raw upstream PyTorch `.pth` checkpoints (a ZIP + a data-only pickle interpreter,
# `src/weights/{pickle,zip}.rs`) straight from a model directory, as opposed to only the packed
# `ZJM1`/`ZJB1` bundles `pack-models` writes (`src/weights/packed.rs`, always available). On by
# default; the browser wasm build turns it off (`wasm/Cargo.toml`: it only ever reads packed
# bundles) to drop the pickle interpreter from the shipped binary — see
# `benchmarks/wasm_size_*.md`.
pth = []

[dependencies]
archmage = { version = "0.9.29", features = ["macros"] }
magetypes = { version = "0.9.29" }
rayon = { version = "1.12.0", optional = true }
libm = "0.2.16"
whereat = { version = "0.1.5", default-features = false }
zenpng = { version = "0.1.4", optional = true }
imgref = { version = "1.12.3", optional = true }
rgb = { version = "0.8.53", optional = true }
enough = { version = "0.4.4", default-features = false }
zencodec = { version = "0.1.26", optional = true }
zenpixels = { version = "0.2.16", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Browser timer for the `wasm-clock` feature (Instant::now panics on this target).
js-sys = { version = "0.3.105", optional = true }

[[example]]
name = "make_roi_mask"
required-features = ["cli"]

# The rest of examples/ debug/profile against internal modules directly (entropy stage,
# reconstruction, filters).
[[example]]
name = "dbg_entropy"
required-features = ["unstable-internals"]

[[example]]
name = "dbg_recon"
required-features = ["unstable-internals"]

[[example]]
name = "prof_entropy"
required-features = ["unstable-internals"]

[[example]]
name = "prof_filters_efe"
required-features = ["unstable-internals"]

[[example]]
name = "prof_filters_lef_icci"
required-features = ["unstable-internals"]

# Synthetic adversarial sources for the f16-weight study; the generator lives with the other
# reference-vector scripts, not in examples/ (PNG write is zenpng only).
[[example]]
name = "gen_synthetic_inputs"
path = "scripts/ref_vectors/gen_synthetic_inputs.rs"
required-features = ["cli"]

[[bin]]
name = "zenjpegai"
required-features = ["cli"]

[dev-dependencies]
zenbench = "0.1.9"

[[bench]]
name = "conv_kernels"
harness = false
required-features = ["unstable-internals"]

# `tests/api_ref.rs` and `tests/codec_ref.rs` need no entry here: the former uses only the
# public API, the latter's own `required-features` come from being behind the `zencodec`
# feature (which implies `unstable-internals`) via its `#![cfg(...)]`. Every other
# integration test imports internal modules (`nn`, `model`, `mans`, `decoder::{entropy,
# reconstruct, output}`, `filters`, `container`, `tensor`, `weights`) directly and needs the
# feature enabled just to compile — see PORTING.md "API hygiene".
[[test]]
name = "decode_ref"
required-features = ["unstable-internals"]

[[test]]
name = "encode_ref"
required-features = ["unstable-internals"]

[[test]]
name = "entropy_ref"
required-features = ["unstable-internals"]

[[test]]
name = "fast_vs_reference"
required-features = ["unstable-internals"]

[[test]]
name = "filters_efe_ref"
required-features = ["unstable-internals"]

[[test]]
name = "filters_lef_icci_ref"
required-features = ["unstable-internals"]

[[test]]
name = "mans_vectors"
required-features = ["unstable-internals"]

[[test]]
name = "math_tiers"
required-features = ["unstable-internals"]

[[test]]
name = "nn_vectors"
required-features = ["unstable-internals"]

[[test]]
name = "packed_bundle"
required-features = ["unstable-internals"]

[[test]]
name = "weights_ref"
required-features = ["unstable-internals"]

[[test]]
name = "f16_weights"
required-features = ["unstable-internals"]

# Replays fuzz/regression/* through the same entry points the libFuzzer bins
# run (fuzz/fuzz_targets/common.rs, included by both). Needs internals + std.
[[test]]
name = "fuzz_regression"
required-features = ["std", "unstable-internals"]

# The float layers are unusable unoptimised (a 0.5 MP decode takes minutes); tests need them.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
debug = "line-tables-only"
incremental = true

[profile.bench]
debug = "line-tables-only"

# The browser builds (`wasm/`, built by `web/scripts/build-wasm.sh`): speed first, no unwinding.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false

# Size-measurement variant of wasm-release (see benchmarks/wasm_size_*.md): opt-level "z" vs "3",
# everything else identical. Not built by web/scripts/build-wasm.sh; a one-off A/B measurement.
[profile.wasm-release-z]
inherits = "wasm-release"
opt-level = "z"
