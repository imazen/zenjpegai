[package]
name = "zenjpegai"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version = "1.89"

description = "JPEG AI (ISO/IEC 6048-1 | ITU-T T.840.1) learned image codec in safe Rust — a port of the JPEG AI reference software"
homepage = "https://github.com/imazen/zenjpegai"
repository = "https://github.com/imazen/zenjpegai"
documentation = "https://docs.rs/zenjpegai"
categories = ["multimedia::images", "multimedia::encoding", "encoding"]
keywords = ["jpeg-ai", "image", "decoder", "encoder", "codec"]
readme = "README.md"
autobenches = false

include = ["/src", "LICENSE-AGPL3", "LICENSE-COMMERCIAL", "upstream-notices", "README.md", "CHANGELOG.md"]

[workspace]
members = [".", "gpu"]

[features]
default = ["std", "parallel", "avx512"]
# File IO helpers (checkpoint loading from disk) and std::error::Error impls.
std = []
# Multi-threaded network inference and entropy-thread decoding via rayon.
parallel = ["std", "dep:rayon"]
# Tests that need the upstream reference checkout (models, reference vectors). With this
# feature on, missing data is a hard failure, never a skip. Run through `just test-ref`.
reference-tests = []
# AVX-512 kernels (archmage v4 tier).
avx512 = ["archmage/avx512", "magetypes/avx512"]
# The `zenjpegai` command line tool (PNG output through zenpng).
cli = ["std", "dep:zenpng", "dep:imgref", "dep:rgb"]

[dependencies]
archmage = { version = "0.9.29", features = ["macros"] }
magetypes = { version = "0.9.29" }
rayon = { version = "1.12.0", optional = true }
libm = "0.2.16"
whereat = { version = "0.1.5", default-features = false }
zenpng = { version = "0.1.4", optional = true }
imgref = { version = "1.12.3", optional = true }
rgb = { version = "0.8.53", optional = true }
enough = { version = "0.4.4", default-features = false }

[[example]]
name = "make_roi_mask"
required-features = ["cli"]

[[bin]]
name = "zenjpegai"
required-features = ["cli"]

[dev-dependencies]
zenbench = "0.1.9"

[[bench]]
name = "conv_kernels"
harness = false

# The float layers are unusable unoptimised (a 0.5 MP decode takes minutes); tests need them.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
debug = "line-tables-only"
incremental = true

[profile.bench]
debug = "line-tables-only"
