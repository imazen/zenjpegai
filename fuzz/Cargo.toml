[package]
name = "zenjpegai-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4.4"

[dependencies.zenjpegai]
path = ".."
features = ["unstable-internals", "zencodec"]

[dependencies.zencodec]
version = ">=0.1.26, <0.3.0"


# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "container_headers"
path = "fuzz_targets/container_headers.rs"
test = false
doc = false

[[bin]]
name = "entropy_stage"
path = "fuzz_targets/entropy_stage.rs"
test = false
doc = false

[[bin]]
name = "decode_full"
path = "fuzz_targets/decode_full.rs"
test = false
doc = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false

# Structural inventories are unreleased; match the root manifest.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }

linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

garb = { git = "https://github.com/imazen/garb", rev = "605276d717ea0b31a1cd2a36ae05301383c7b8b5" }

zentone = { git = "https://github.com/imazen/zentone", rev = "4b5ab710157743e3018b7de3a79f336c2f61113e" }
